# Settings for the TOOLING tests only (our scripts, not the Toolshop app).
# Run them with: scripts/check_tooling.sh
#   (same as: pytest -c tooling_tests/pytest.ini tooling_tests)
# The folder name at the end matters: without it pytest looks in the current folder.
# `pytest tooling_tests` works too: pytest finds this file next to the tests.
#
# Because this file is passed with -c, the project's own pytest.ini and
# conftest.py are not used: no ISTQB tag rule, no --html report, no Allure
# results, no browser, no run history. Everything a test writes goes into
# pytest's temporary folders.
[pytest]
# Turn off the plugins the product suite uses, and pytest's cache folder,
# so this run reads and writes nothing in the project.
addopts =
    -p no:cacheprovider
    -p no:playwright
    -p no:html
    -p no:html_fixtures
    -p no:metadata
    -p no:allure_pytest
    -p no:rerunfailures
    --strict-markers
