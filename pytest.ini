[pytest]
testpaths = tests
markers =
    istqb(technique): ISTQB test-design technique this test applies (required on every test)
    healed(log_id): test was repaired under docs/HEALING_RULES.md; log_id points to docs/heal_log.md
    smoke: fast checks that the most important paths work
    ui: browser tests
    api: REST API tests

# Step logs (INFO) are captured and shown in each test's Log box in the report.
log_level = INFO
log_format = %(asctime)s  %(message)s
log_date_format = %H:%M:%S

# Browser runs headless by default. Add --headed in PyCharm to watch a run.
# Screenshots are embedded in the report by conftest.py (settings.REPORT_SCREENSHOTS).
# Traces of failed tests are kept in test-results/ (open with: playwright show-trace).
addopts =
    --browser chromium
    --tracing retain-on-failure
    --html=report/index.html
    --self-contained-html
