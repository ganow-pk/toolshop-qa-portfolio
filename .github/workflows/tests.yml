name: Tests

# Branch flow: feature/* --PR--> develop --> release/vX.Y --PR--> main --> tag vX.Y.
# hotfix/* may PR straight into main. Every push and PR runs the API tests;
# only main deploys the live report to GitHub Pages (see docs/RELEASING.md).
#
# UI tests are not run here: the practice site's Cloudflare bot check blocks
# browsers on GitHub's cloud runners. The API tests run live every day; the
# full UI + API run is published from a local machine (scripts/publish_local_run.py).
# main also keeps the dashboard's run history (history/ci.json on the live site).
# Pull requests and develop never deploy to GitHub Pages: a PR's report is
# attached to the run as a downloadable artifact instead.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:        # "Run workflow" button on GitHub
  schedule:
    - cron: "17 13 * * *"   # daily, so the API report always shows a recent run

# Least privilege: by default jobs can only read the repo.
# Only the deploy job gets the extra Pages permissions.
permissions:
  contents: read

# PRs get their own group per PR, so a new push to the PR cancels its older run
# but never cancels (or waits on) a deploy from main. Runs on main share "pages";
# runs on any other branch (develop, scheduled runs) get a group per branch, so
# they can never cancel a main deploy either.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && 'pages' || format('ci-{0}', github.ref)) }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outcome }}   # publish-report deploys only if the site was built
    env:
      # true only for runs on main that are not PRs: the same guard as the deploy.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      SITE_URL: https://ganow-pk.github.io/toolshop-qa-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests for our own scripts (run history, dashboard, the site build below),
      # not for the app. A few seconds, no network. Runs first, so a broken
      # script fails the PR. Writes only to temp folders: nothing in
      # allure-results/ or public/, so it never changes the reports or counts.
      - name: Check the tooling (history and dashboard scripts)
        run: scripts/check_tooling.sh

      - name: Run API tests
        run: pytest -m api --html=public/ci-api/index.html

      # Allure report of this run, next to the HTML report. Optional: if npm is
      # down, the site is still built, just without the Allure link.
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "22"

      - name: Build the Allure report
        if: always()
        continue-on-error: true
        run: npx --yes allure@3.33.0 generate allure-results --output public/ci-api/allure

      # Dashboard history. main: download the live history, add this run.
      # A 404 (no history yet) starts a new one; any other download problem
      # fails this step, and then nothing is deployed, so the live history is
      # never replaced by an empty one. PRs and develop: a one-run preview only;
      # they never read or write the live history.
      - name: Add this run to the run history
        id: history
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python scripts/run_history.py fetch --url "$SITE_URL/history/ci.json" --out public/history/ci.json
          else
            mkdir -p public/history && echo "[]" > public/history/ci.json
          fi
          python scripts/run_history.py record --results allure-results \
            --history public/history/ci.json --source ci \
            --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --run-url "$RUN_URL"

      - name: Build the dashboard
        id: site
        if: always() && steps.history.outcome == 'success'
        run: |
          mkdir -p public/full-run
          if [ -f reports/local-full-run.html ]; then
            cp reports/local-full-run.html public/full-run/index.html
          else
            echo "<p>No local full run published yet.</p>" > public/full-run/index.html
          fi
          LINKS=(--link "Full run (UI + API): HTML report=full-run/")
          if [ -f reports/local-full-run-allure.html ]; then
            mkdir -p public/full-run/allure
            cp reports/local-full-run-allure.html public/full-run/allure/index.html
            LINKS+=(--link "Full run (UI + API): Allure report=full-run/allure/")
          fi
          LINKS+=(--link "Daily CI run (API): HTML report=ci-api/")
          if [ -f public/ci-api/allure/index.html ]; then
            LINKS+=(--link "Daily CI run (API): Allure report=ci-api/allure/")
          fi
          if [ -f reports/history-local.json ]; then
            cp reports/history-local.json public/history/local.json
          else
            echo "[]" > public/history/local.json
          fi
          # Social preview card (og:image) for links pasted into LinkedIn, Slack, email.
          cp assets/social-preview.png public/social-preview.png
          python scripts/build_dashboard.py --ci-history public/history/ci.json \
            --local-history public/history/local.json --out public/index.html "${LINKS[@]}" \
            --site-url "$SITE_URL"

      # PRs and develop: keep the report and a dashboard preview with the run as
      # a download, so a failing PR can be inspected and develop's report
      # previews the next release. (main publishes to GitHub Pages instead.)
      - name: Upload test report (PR and develop)
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            public/
            allure-results/
          if-no-files-found: warn

      # main only: a spare copy of the CI history, in case the live site ever
      # loses it (restore by publishing this file as history/ci.json).
      - name: Back up the run history (main)
        if: always() && env.PUBLISH == 'true' && steps.site.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: public/history/
          retention-days: 90

      # main only (never a PR, never develop), and only if the dashboard was built.
      - name: Prepare site for GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  publish-report:
    needs: test
    # Deploy from main only, never from a PR or develop; publish even if tests
    # failed, but never if the dashboard or its history could not be built.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.outputs.site == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Scheduled runs always use the default branch, which is now develop, so they
  # test develop and do not deploy. To keep the live report fresh, this job asks
  # GitHub to run the workflow on main too. A workflow_dispatch sent with
  # GITHUB_TOKEN does start a new run (unlike most events from GITHUB_TOKEN).
  refresh-main-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start a run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --ref main --repo "${{ github.repository }}"

  # GitHub can't restrict which branch a PR comes from, so this check does:
  # only release/* and hotfix/* branches may be merged into main.
  # It is a required check on main; for PRs into develop it is skipped.
  release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the PR comes from release/* or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}   # via env, never pasted into the script
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "OK: '$HEAD_REF' may be merged into main." ;;
            *)
              echo "::error::PRs into main must come from a release/* or hotfix/* branch, not '$HEAD_REF'. Open this PR into develop instead (see docs/RELEASING.md)."
              exit 1 ;;
          esac
