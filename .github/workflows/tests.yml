name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on GitHub
  schedule:
    - cron: "17 13 * * *"   # daily, so the report always shows a recent run

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest

      - name: Keep screenshots and traces of failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Prepare report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/

  publish-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
