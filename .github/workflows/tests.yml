name: Tests

# UI tests are not run here: the practice site's Cloudflare bot check blocks
# browsers on GitHub's cloud runners. The API tests run live every day; the
# full UI + API run is published from a local machine (scripts/publish_local_run.py).
# Pull requests into main run the same API tests but never deploy to GitHub Pages:
# their report is attached to the run as a downloadable artifact instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on GitHub
  schedule:
    - cron: "17 13 * * *"   # daily, so the API report always shows a recent run

# Least privilege: by default jobs can only read the repo.
# Only the deploy job gets the extra Pages permissions.
permissions:
  contents: read

# PRs get their own group per PR, so a new push to the PR cancels its older run
# but never cancels (or waits on) a deploy from main. Everything else shares "pages".
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest -m api --html=public/ci-api/index.html

      # PRs only: keep the report with the run, so a failing PR can be inspected.
      - name: Upload test report (PR)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            public/ci-api/
            allure-results/
          if-no-files-found: warn

      - name: Build the report site
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p public/full-run
          cp site/index.html public/index.html
          if [ -f reports/local-full-run.html ]; then
            cp reports/local-full-run.html public/full-run/index.html
          else
            echo "<p>No local full run published yet.</p>" > public/full-run/index.html
          fi

      - name: Prepare site for GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  publish-report:
    needs: test
    # Never deploy from a PR; for everything else publish even if tests failed.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
